<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halvian ED Triage Assistant</title>
  <link rel="stylesheet" href="src/shared/styles.css">
</head>
<body>
  <div class="app-top">
  <div class="banner-synthetic" role="note">Synthetic data — demo only</div>
  <header class="app-header">
    <h1>Halvian ED Triage Assistant</h1>
    <span class="spacer"></span>
    <details class="ai-connect" id="ai-connect">
      <summary id="ai-status" data-state="none" title="Without a key, simple keyword rules are used instead of AI. In production, the model runs inside Halvian's own cloud under a BAA.">AI: not connected</summary>
      <div class="ai-connect-body" id="ai-key-box">
        <label for="ai-provider">AI model</label>
        <select id="ai-provider" style="width:100%;margin-bottom:.5rem"><option value="gemini">Gemini (Google)</option><option value="claude">Claude (Anthropic)</option></select>
        <label for="ai-key" id="ai-key-label">Gemini API key (Google AI Studio)</label>
        <input type="password" id="ai-key" autocomplete="off" placeholder="AIza...">
        <div class="row"><button type="button" class="btn btn-sm btn-primary" id="ai-key-use">Connect</button>
        <button type="button" class="btn btn-sm" id="ai-key-clear">Disconnect</button></div>
      </div>
    </details>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-queue" data-tab="queue" aria-controls="panel-queue" aria-selected="true">Queue <span class="tab-count" id="count-queue" hidden></span></button>
    <button class="tab" role="tab" id="tab-fasttrack" data-tab="fasttrack" aria-controls="panel-fasttrack" aria-selected="false" tabindex="-1">Fast-track <span class="tab-count" id="count-fasttrack" hidden></span></button>
    <button class="tab" role="tab" id="tab-capacity" data-tab="capacity" aria-controls="panel-capacity" aria-selected="false" tabindex="-1">Capacity <span class="tab-count" id="count-capacity" hidden></span></button>
    <button class="tab" role="tab" id="tab-results" data-tab="results" aria-controls="panel-results" aria-selected="false" tabindex="-1">Results</button>
  </nav>
  </div>
  <div class="banner-warning in-app" id="ai-offline-banner" role="status" hidden>
    AI is offline. Suggestions are paused and the queue falls back to acuity (ESI) level, then arrival time. Nurses keep full control.
  </div>


  <main>
    <section role="tabpanel" id="panel-queue" aria-labelledby="tab-queue"><div id="mod-ranking"></div></section>
    <section role="tabpanel" id="panel-fasttrack" aria-labelledby="tab-fasttrack" hidden><div id="mod-fasttrack"></div></section>
    <section role="tabpanel" id="panel-capacity" aria-labelledby="tab-capacity" hidden><div id="mod-capacity"></div></section>
    <section role="tabpanel" id="panel-results" aria-labelledby="tab-results" hidden><div id="mod-results"></div></section>
  </main>

  <noscript><p class="banner-warning">This demo needs JavaScript enabled.</p></noscript>

  <!-- Classic scripts only (no modules, no fetch) so this works when double-clicked (file://). -->
  <script src="data/patients.js"></script>
  <script src="data/history.js"></script>
  <script src="data/rooms.js"></script>
  <script src="data/fasttrack_model.js"></script>
  <script src="data/results.js"></script>
  <script src="src/shared/core.js"></script>
  <script src="src/shared/ai.js"></script>
  <script src="src/ranking/ranking.js"></script>
  <script src="src/fasttrack/fasttrack.js"></script>
  <script src="src/capacity/capacity.js"></script>
  <script src="src/results/results.js"></script>
  <script src="src/shared/tabcounts.js"></script>
</body>
</html>
